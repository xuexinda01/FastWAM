# @package _global_
#
# Task config for H-FastWAM v2 on Nav VLN (5B).
#
# Mirrors nav_vln_action_only_5b.yaml so we can compare runs apples-to-apples,
# but is kept as a separate file so the original Action-Only training is not
# affected.

# dataloading — matches the 5B action-only run
batch_size: 8
num_workers: 4

model:
  mot_checkpoint_mixed_attn: false

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 5e-5
num_epochs: 10
max_steps: null
log_every: 10
save_every: 100
eval_every: 400
n_eval_samples_per_gpu: 4

# training
gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: null
